name: Terraform Plan

on:
  pull_request:
      branches:
          - MASTER_ENV
        

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./environments/dev
    steps:
        - uses: actions/checkout@v4
        - uses: hashicorp/setup-terraform@v3
          with:
                terraform_version: "1.14.3"
                cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

        - name: Terraform fmt
          id: fmt
          run: terraform fmt -check #verifies file formatting
          continue-on-error: true

        - name: Terraform Init
          id: init
          run: terraform init -input=false #no prompts for input

        - name: Terraform Validate
          id: validate
          run: terraform validate -no-color #plain text output

        - name: Terraform Plan
          id: plan
          run: terraform plan -no-color -input=false
          continue-on-error: true


      
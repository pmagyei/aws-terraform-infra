name: AWS-Terraform-Destroy
run-name: aws-terraform-destroy

on: 
  workflow_dispatch:
    inputs:
        confirm_destroy:
            description: 'Type "DESTROY" to confirm'
            required: true
            type: string
  
# permissions to be granted for workflow 
permissions: #generates tokens for each job on the workflow
  id-token: write  
  contents: read
jobs:
  terraform-destroy:
    runs-on: ubuntu-latest
    # environment:
    #   name: 'aws-main-environment'
    defaults:
        run: 
          shell: bash 
          working-directory: ./terraform
  
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::890742561478:role/github-oidc
          aws-region: eu-west-2
          role-session-name: ghawsoidc  # session name, requires GH to use the name "ghawsoidc" If it tries to use any other name,
          # AWS will block the login.
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        
      - name: Terraform Init
        id: init
        run: terraform init -input=false 

      - name: Terraform Destroy
        if: github.event.inputs.confirm_destroy == 'DESTROY'
        run: terraform destroy -auto-approve
        continue-on-error: true   